[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "setup-ssh-cli"
version = "0.1.0"
description = "Set up passwordless SSH between your Linux, Windows, and macOS devices."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "beepboopbit" }]
keywords = ["ssh", "openssh", "passwordless", "netbird", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = ["paramiko>=3.4,<5"]

[project.urls]
Repository = "https://github.com/BeepBoopBit/setup-ssh"
Issues = "https://github.com/BeepBoopBit/setup-ssh/issues"
Documentation = "https://github.com/BeepBoopBit/setup-ssh#readme"

[project.scripts]
setup-ssh = "setup_ssh.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
setup_ssh = ["templates/*.sh", "templates/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
